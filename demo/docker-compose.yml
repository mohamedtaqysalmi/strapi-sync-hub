# Local demo: Strapi-shaped CMS + Meilisearch + sync-hub + one-shot seed.
# The "strapi" service is a lightweight stand-in that speaks the Content API and
# fires webhook payloads with the same envelope as Strapi docs. Swap STRAPI_URL
# for a real Strapi when you have one.
services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: demomasterkeydemomasterkey12
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  strapi:
    build:
      context: ./strapi-standin
    environment:
      PORT: "1337"
      SYNC_HUB_URL: http://sync-hub:8000/webhook
      SYNC_SECRET: demo-secret-at-least-16
    ports:
      - "1337:1337"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1337/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync-hub:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    environment:
      STRAPI_SYNC_SECRET: demo-secret-at-least-16
      STRAPI_SYNC_TARGET: meilisearch
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: demomasterkeydemomasterkey12
      STRAPI_SYNC_MAPPING: /app/demo/mapping.yaml
      STRAPI_SYNC_DEAD_LETTER_PATH: /tmp/dead-letter.jsonl
      STRAPI_SYNC_MAX_RETRIES: "3"
      STRAPI_SYNC_RETRY_BASE_SECONDS: "0.2"
      STRAPI_URL: http://strapi:1337
    ports:
      - "8000:8000"
    depends_on:
      meilisearch:
        condition: service_healthy
      strapi:
        condition: service_healthy

  seed:
    build:
      context: ./strapi-standin
    environment:
      STRAPI_URL: http://strapi:1337
      SYNC_HUB_URL: http://sync-hub:8000/webhook
      SYNC_SECRET: demo-secret-at-least-16
    command: ["python", "seed.py"]
    depends_on:
      sync-hub:
        condition: service_started
      strapi:
        condition: service_healthy
