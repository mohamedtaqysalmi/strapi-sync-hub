[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strapi-sync-hub"
version = "0.0.1"
description = "Sync Strapi content to Meilisearch and webhook targets, driven by Strapi webhooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed-Taqy Salmi" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://mohamedtaqysalmi.github.io/strapi-sync-hub/"
Repository = "https://github.com/mohamedtaqysalmi/strapi-sync-hub"
Changelog = "https://github.com/mohamedtaqysalmi/strapi-sync-hub/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strapi_sync_hub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=strapi_sync_hub --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["strapi_sync_hub"]

[tool.coverage.report]
fail_under = 85
show_missing = true
